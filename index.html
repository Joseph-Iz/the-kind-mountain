<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Kind Mountain</title>
<style>
html,body{margin:0;height:100%;background:#1b1f2e;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer;outline:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="The Kind Mountain. A game played with the two Shift keys. Hold Left Shift to hold the rope tight, release it to give slack, tap Right Shift for a gust of wind."></canvas>
<script>
(() => {
'use strict';

/* ---------- setup ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 800, H = 600, DPR = 1, K = 2, K0 = 2, lowQ = 0, ft = .016;
function resize() {
  DPR = lowQ === 2 ? .7 : lowQ === 1 ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth || 800; H = window.innerHeight || 600;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K0 = Math.min(H / 200, W / 232); K = K0;           // screen pixels per world unit
}
window.addEventListener('resize', resize); resize();

const ART = { bg: [], ic: {} };
if (typeof Image !== 'undefined') {
  const ld = src => { const i = new Image(); i.onload = () => { i.ok = true; }; i.src = src; return i; };
  ['spring', 'summer', 'autumn', 'winter'].forEach(n => ART.bg.push(ld('assets/bg_' + n + '.jpg')));
  ART.cover = ld('assets/cover.jpg');
  ['blossom', 'kite', 'leaf', 'star', 'mitten', 'kite2', 'letter'].forEach(n => { ART.ic[n] = ld('assets/ic_' + n + '.png'); });
}
function bgImg(im, a, p) {
  const sc = Math.max(W / im.width, H / im.height) * 1.04, w = im.width * sc, h = im.height * sc;
  ctx.globalAlpha = a; ctx.drawImage(im, (W - w) / 2, (H - h) + p * (h - H), w, h); ctx.globalAlpha = 1;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, f) => a + (b - a) * f;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function mix(a, b, f) { const A = hex(a), B = hex(b); return 'rgb(' + Math.round(lerp(A[0], B[0], f)) + ',' + Math.round(lerp(A[1], B[1], f)) + ',' + Math.round(lerp(A[2], B[2], f)) + ')'; }

/* ---------- tuning ---------- */
const PITCH = 230, PITCHES = 8, SUMMIT = PITCH * PITCHES, HOLD_DY = 14;
const BAND_LO = 0.40, BAND_HI = 0.70;
const ROPE_MIN = 24, ROPE_MAX = 42, SPEED = 17;
const DT = { solid: 0.25, crumbly: 0.55, slick: 0.70, ledge: 0.25 };   // how demanding each rock is
const AGE_E = [-0.10, 0, 0.05, 0.10];    // children bore easily, elders frighten easily
const AGE_V = [1.05, 1.1, 0.97, 0.84];   // climbing speed by age
const PAL = [
  { skyT: '#9fd8ec', skyB: '#f6f0d4', rock: '#9aa890', rockD: '#77886f', far: '#b9d4c2', acc: '#63a85f' },
  { skyT: '#63b7ea', skyB: '#d9f1fb', rock: '#b9a184', rockD: '#927a5e', far: '#a9cfe0', acc: '#e3b84f' },
  { skyT: '#e9925a', skyB: '#fbe0c2', rock: '#94736a', rockD: '#72544d', far: '#d9a98a', acc: '#c9552f' },
  { skyT: '#060a1a', skyB: '#1b2547', rock: '#39455f', rockD: '#273049', far: '#131a34', acc: '#dfe8ff' }
];
const DARK = '#2a2233', GOLD = '#ffd24a';
// The ending poem: lines from "Ideas" by Joseph Izampuye, in the voice of the climber who stays. Each keepsake earns one line.
const POEM = [
  "One day I'll be laidback.", "You'll see me, grey, on the ocean greens,", 'where grass is the body and harmony the sea.',
  'On that day the sky is melody blue,', 'blueberry fruit on the branches', "of the yellow bird's tree.",
  'On that day the soft clouds kiss the apricots,', 'and the sun becomes an umbrella.', 'I will watch without malice, without a worry,',
  'my plans asleep with me, and care-free,', 'like stories on the pages of a book', 'read a breath before the evening.'
];
const LAST = 'Then I opened my hand.';   // the mountain's answer, always shown
const TRK = [520, 760, 1000, 1240, 1450, 1680];   // heights where something from their past comes loose

/* ---------- the wall ---------- */
let wall = null;
function genWall(seed) {
  const r = mulberry(seed), sections = [];
  const WT = [[.72, .28], [.45, .38], [.30, .28], [.24, .24]];
  for (let p = 0; p < PITCHES; p++) {
    const se = p >> 1; let y = p * PITCH + 20; const end = (p + 1) * PITCH - 16; let i = 0, prev = '';
    while (y < end - 8) {
      const y1 = Math.min(end, y + 38 + r() * 34); let type;
      if (p === 0 && i === 0) type = 'solid';
      else if (p === 0 && i === 1) type = 'crumbly';
      else {
        const w = WT[se], x = r();
        type = x < w[0] ? 'solid' : x < w[0] + w[1] ? 'crumbly' : 'slick';
        if (type === prev && r() < .6) type = type === 'solid' ? (se > 1 ? 'slick' : 'crumbly') : 'solid';
      }
      sections.push({ y0: y, y1: y1, type: type }); prev = type; y = y1; i++;
    }
  }
  const holds = []; let x = 0; const n = Math.ceil(SUMMIT / HOLD_DY) + 3;
  for (let i = 0; i < n; i++) {
    x += (r() - .5) * 44; x -= x * .12; if (i * HOLD_DY > SUMMIT - 90) x *= .75;
    x = clamp(x, -66, 66);
    holds.push({ x: x, y: i * HOLD_DY, rot: r() * 6.28, s: .8 + r() * .5 });
  }
  return { sections: sections, holds: holds };
}
function typeAt(y) {
  if (y >= SUMMIT - 16 || y < 20) return 'ledge';
  const m = y % PITCH; if (m < 20 || m > PITCH - 16) return 'ledge';
  const s = wall.sections;
  for (let i = 0; i < s.length; i++) if (y >= s[i].y0 && y < s[i].y1) return s[i].type;
  return 'solid';
}
function routeX(y) {
  const hs = wall.holds, f = clamp(y / HOLD_DY, 0, hs.length - 1.001), i = Math.floor(f), t = f - i;
  return lerp(hs[i].x, hs[i + 1].x, t * t * (3 - 2 * t));
}
function windAt(t, se) { const b = [0, .3, .55, .85][se]; return clamp(b * (.55 + .45 * Math.sin(t * .4) + .2 * Math.sin(t * 1.3 + 1)), 0, 1); }
function edge(y, s) {
  const taper = 1 - .32 * smooth(SUMMIT - 80, SUMMIT, y);
  return s * taper * (108 + 7 * Math.sin(y * .045 + s * 1.3) + 4 * Math.sin(y * .13 + s));
}

/* ---------- state ---------- */
const inp = { sl: false, sp: false, pt: false, ptId: null };
const S = { mode: 'title', t: 0, T: 0, held: false, cam: 14, wind: 0, fx: [], lights: 0, zoom: 1, shake: 0, shx: 0, shy: 0 };
function say(t) { S.cap = { text: t, t: 0 }; }   // the mountain's own thoughts, shown briefly
function mk(id) {
  return { id: id, h: 0, e: .5, age: 0, state: 'rest', phase: id * 1.7, boredT: 0, slipCd: 6, joyT: 0, dropT: 0, jolt: 0,
    vel: 0, sw: null, rec: null, inBand: true, temper: id === 0 ? -.07 : .07, alpha: 1, walk: 0, moving: false };
}
function reset(mode) {
  wall = genWall((Math.random() * 1e9) | 0);
  S.moments = []; for (let i = 0; i < 12; i++) { const y = 60 + i * 150; S.moments.push({ x: routeX(y) + (i % 2 ? 17 : -17), y: y, se: Math.min(3, Math.floor(y / (2 * PITCH))), st: 0 }); }
  S.wgCd = 9; S.wgT = 0;
  S.falls = []; S.debCd = 14; S.trkI = 0; S.past = 0;
  S.zoom = mode === 'play' ? .55 : 1; S.shake = 0; S.lastM = 1; S.wasHeld = false; S.poemI = -1;
  S.kept = 0; S.streak = 0; S.best = 0; S.prevBest = 0; S.newBest = false; S.style = 0;
  S.t = 0; S.T = 0; S.gustCd = 0; S.lights = 0; S.fx = []; S.catches = 0; S.snow = 0; S.saves = 0;
  S.lastLedge = 0; S.ledgeK = 1; S.restT = 1.2; S.restAge = false; S.aged = false; S.lightAcc = 0; S.flash = 0;
  S.swinger = null; S.fallC = null; S.cam = 14; S.endT = 0; S.armed = false; S.summitT = 0; S.snowT = 0; S.gustFx = 0;
  S.mercy = 0; S.wind = 0; S.starsShown = 0; S.shelf = -1; S.solo = false; S.parting = false;
  S.A = mk(0); S.B = mk(1); S.cl = [S.A, S.B];
  S.mode = mode || 'play'; S.cap = null;
  if (S.mode === 'play') say('Here they come again.');
}
reset('title');

const inBand = c => c.e >= BAND_LO && c.e <= BAND_HI;

/* ---------- sound (all generated, no files) ---------- */
let AC = null, mg = null, windG = null, drA = null, drB = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { try { if (AC.state === 'suspended') AC.resume(); } catch (e) {} return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C(); mg = AC.createGain(); mg.gain.value = .9; mg.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = .6;
    windG = AC.createGain(); windG.gain.value = 0; src.connect(f); f.connect(windG); windG.connect(mg); src.start();
    drA = mkDrone(293.66); drB = mkDrone(196);
  } catch (e) { AC = null; }
}
function mkDrone(fq) { const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = fq; const g = AC.createGain(); g.gain.value = 0; o.connect(g); g.connect(mg); o.start(); return { o: o, g: g, fq: fq }; }
function tone(fq, dur, vol, type, when) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(mg); o.start(t); o.stop(t + dur + .05);
  } catch (e) {}
}
function noise(dur, vol, f0, f1) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(mg); s.start(t); s.stop(t + dur + .05);
  } catch (e) {}
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
const snd = {
  chime(m) { tone(PENTA[Math.min(5, (m || 1) - 1 + ((Math.random() * 3) | 0))], .9, .05); },
  taut() { tone(196, .2, .06, 'triangle'); },
  loose() { tone(147, .28, .045); },
  up(m) { tone(PENTA[Math.min(5, m)], .7, .07); tone(PENTA[Math.min(5, m + 1)], .9, .05, 'sine', .1); },
  crack() { noise(.3, .3, 1800, 400); tone(170, .18, .1, 'square'); },
  keep() { tone(880, .5, .07); tone(1318.5, .9, .07, 'sine', .12); },
  gust() { noise(.7, .22, 300, 1400); },
  thunk() { tone(110, .25, .14); },
  slip() { tone(330, .5, .08, 'triangle'); tone(247, .6, .08, 'triangle', .08); },
  save() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, .8, .07, 'sine', i * .09)); },
  snow() { noise(.9, .3, 900, 150); tone(70, .5, .2); },
  age() { [392, 493.88, 587.33].forEach((f, i) => tone(f, 1.4, .05, 'sine', i * .12)); },
  part() { [392, 349.23, 293.66].forEach((f, i) => tone(f, 1.8, .06, 'triangle', i * .45)); },
  release() { [783.99, 659.25, 523.25, 392].forEach((f, i) => tone(f, 2.2, .06, 'sine', i * .4)); }
};
const ROOT = [261.63, 293.66, 220, 196], MAJ = [1, 1.125, 1.25, 1.5, 1.6667, 2], MIN = [1, 1.2, 1.3333, 1.5, 1.8, 2], BEAT = [.52, .46, .6, .78];
let musT = 0, musI = 2, musN = 0;
function musicTick(dt) {                       // the mountain hums a tune while both climbers are happy
  if (!AC || muted || S.mode !== 'play' || S.restT > 0 || S.snowT > 0 || S.swinger) return;
  const se = S.style || 0; musT += dt; if (musT < BEAT[se]) return; musT = 0; musN++;
  if (!(S.A.inBand && S.B.inBand)) return;
  if (S.solo && musN % 2) return;
  musI = clamp(musI + ((Math.random() * 3) | 0) - 1, 0, 5); if (Math.random() < .15) musI = (Math.random() * 6) | 0;
  const f = ROOT[se] * (se < 2 ? MAJ : MIN)[musI];
  tone(f * 2, 1.3, .03); tone(f, 1.5, .022, 'triangle');
  if (musN % 4 === 0) tone(ROOT[se] / 2, 2.4, .04, 'triangle');
}
function audioTick() {
  if (!AC) return;
  try {
    const t = AC.currentTime, live = (S.mode === 'play' || S.mode === 'summit') && !S.paused;
    windG.gain.setTargetAtTime(muted || S.mode === 'title' ? 0 : (.015 + (S.wind || 0) * .09), t, .3);
    const pairs = [[drA, S.A], [drB, S.B]];
    for (let i = 0; i < 2; i++) {
      const d = pairs[i][0], c = pairs[i][1]; let v = 0;
      if (!muted && live && !(S.solo && c === S.B)) v = c.inBand ? .045 : c.e > BAND_HI ? .02 : 0;
      d.g.gain.setTargetAtTime(v, t, .25);
      d.o.frequency.setTargetAtTime(d.fq * (c.e > BAND_HI ? 1.06 : 1), t, .2);
    }
  } catch (e) {}
}

/* ---------- game logic ---------- */
function pivotOf(c) {
  if (c === S.B) return { x: routeX(S.A.h), y: S.A.h };
  const y = Math.min(SUMMIT, c.h + 26); return { x: routeX(y), y: y };
}
function swingPos(c) { const s = c.sw; return { x: s.piv.x + s.L * Math.sin(s.th), y: s.piv.y - s.L * Math.cos(s.th), rot: s.th }; }
function addLights(n, p, m) {
  S.lights += n;
  for (let i = 0; i < n; i++) S.fx.push({ k: 'light', x: p.x + (Math.random() - .5) * 8, y: p.y + 6, vx: (Math.random() - .5) * 6, vy: 14 + Math.random() * 8, life: 2.6, max: 2.6 });
  snd.chime(m);
}
function sparkle() {
  for (const c of S.cl) { const p = posOf(c); for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; S.fx.push({ k: 'spark', x: p.x, y: p.y + 6, vx: Math.cos(a) * 16, vy: Math.sin(a) * 16, life: 1, max: 1 }); } }
}
function slip(c, forced) {
  const o = c === S.A ? S.B : S.A; c.slipCd = 4; o.slipCd = Math.max(o.slipCd, 2);
  if (S.T >= .55) {                       // rope is tight: a short, safe drop
    c.state = 'drop'; c.dropT = .6; S.catches++; c.e = Math.min(1, c.e + (forced ? .22 : .06)); o.jolt = 1; snd.thunk(); return;
  }
  const piv = pivotOf(c), px = routeX(c.h);
  let L = Math.max(22, Math.hypot(piv.x - px, piv.y - c.h)) + 10 * (1 - S.T);
  const dir = Math.random() < .5 ? -1 : 1, amp = .62 + .4 * (1 - S.T);
  const th0 = Math.atan2(px - piv.x, Math.max(1, piv.y - c.h));
  c.state = 'swing';
  c.sw = { piv: piv, L: L, dir: dir, amp: amp, t: 0, th: th0, th0: th0, star: dir * amp * .5, win: [.30, .27, .24, .22][c.age] };
  S.falls = S.falls.filter(q => q.k !== 'rock'); S.swinger = c; o.jolt = 1; o.e = Math.min(1, o.e + .12); c.e = Math.min(1, c.e + .2);
  S.gustCd = Math.min(S.gustCd, .25); snd.slip();
}
function gust() {
  if (S.mode !== 'play' || S.gustCd > 0) return;
  S.gustFx = .6; snd.gust();
  if (S.swinger) {
    const c = S.swinger, s = c.sw;
    if (Math.abs(s.th - s.star) < s.win) {          // caught the swing
      const p = swingPos(c); c.rec = { x: p.x, y: p.y, t: 0 }; c.state = 'rec'; c.sw = null; S.swinger = null; S.saves++;
      addLights(5, p);
      for (const k of S.cl) { k.e = lerp(k.e, .56, .7); k.joyT = 1.4; k.boredT = 0; }
      snd.save(); S.gustCd = 1.2;
    } else S.gustCd = .4;
    return;
  }
  if (S.restT > 0 || S.snowT > 0) { S.gustCd = .6; return; }
  let used = false;
  for (const f of S.falls) if (f.ph === 1 && !f.blown) {
    f.blown = true; used = true;
    if (f.k === 'rock') { f.vx = (Math.random() < .5 ? -1 : 1) * 75; addLights(2, f, 2); } else f.home = 0;
  }
  if (used) { S.gustCd = .9; return; }
  S.gustCd = 3.2;
  for (const c of S.cl) if (c.state === 'climb' || c.state === 'drop') { c.e = Math.min(1, c.e + .1); c.boredT = Math.max(0, c.boredT - 3); }
}
function toLedge() {
  // the snow sets them down a little below where they fell, never lower than the last ledge
  const y = Math.max(S.lastLedge, (S.solo ? S.A.h : Math.min(S.A.h, S.B.h)) - 40); S.shelf = y > S.lastLedge + 1 ? y : -1;
  for (const c of S.cl) { if (S.solo && c === S.B) continue; c.px = undefined; c.h = y; c.state = 'rest'; c.e = .5; c.sw = null; c.rec = null; c.boredT = 0; c.slipCd = 3; }
  S.falls = []; S.restT = 1.6; S.restAge = false; S.ledgeK = Math.round(S.lastLedge / PITCH) + 1; S.swinger = null; S.fallC = null;
}
function updFalls(dt) {
  const A = S.A, B = S.B;
  S.debCd -= dt;
  if (S.debCd <= 0 && A.state === 'climb' && typeAt(A.h) === 'crumbly') {       // a crumbly hold breaks loose
    const tg = (S.solo || Math.random() < .35) ? A : B; S.debCd = 11 + Math.random() * 7;
    if (tg.state === 'climb') { S.falls.push({ k: 'rock', tg: tg, x: routeX(tg.h + 20), y: tg.h + 95, ph: 0, t: 0, vx: 0, rot: 0 }); snd.crack(); }
  }
  while (S.trkI < TRK.length && A.h >= TRK[S.trkI]) {
    S.falls.push({ k: 'trk', se: Math.min(3, Math.floor(A.h / (2 * PITCH))), x: routeX(A.h) + (S.trkI % 2 ? 40 : -40), y: A.h + 100, ph: 1, t: 0, vx: 0, rot: 0 }); S.trkI++;
  }
  for (let i = S.falls.length - 1; i >= 0; i--) {
    const f = S.falls[i]; f.t += dt; let done = false;
    if (f.k === 'rock') {
      if (f.ph === 0) { if (f.t > 1) f.ph = 1; }
      else {
        f.y -= 62 * dt; f.rot += dt * 6;
        if (f.blown) f.x += f.vx * dt; else f.x = lerp(f.x, routeX(f.tg.h), Math.min(1, dt * 4));
        if (!f.blown && f.tg.state === 'climb' && f.y <= f.tg.h + 7 && f.y >= f.tg.h - 8) {
          f.tg.e = Math.min(1, f.tg.e + .25); S.streak = 0; S.shake = 1; snd.thunk(); slip(f.tg, true);
          S.falls = S.falls.filter(q => q.k !== 'rock'); return;
        }
        if (f.y < S.cam - 140) done = true;
      }
    } else if (f.blown) {                                                        // the gust carries it to the nearer climber
      f.home += dt * 1.8;
      const c = (S.solo || Math.abs(f.y - A.h) < Math.abs(f.y - B.h)) ? A : B, p = posOf(c), u = Math.min(1, f.home);
      f.x = lerp(f.x, p.x, u); f.y = lerp(f.y, p.y + 6, u);
      if (f.home >= 1) { done = true; S.past++; addLights(4, f, 3); snd.keep(); c.joyT = 1.2; }
    } else {
      f.y -= 26 * dt; f.x += Math.sin(f.t * 2.4) * 14 * dt; f.rot = Math.sin(f.t * 2) * .5;
      if (f.y < S.cam - 140) done = true;
    }
    if (done) S.falls.splice(i, 1);
  }
}
function arrive(y) {
